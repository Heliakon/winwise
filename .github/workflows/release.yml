name: Attach download to release

# When a release is published, checks the tagged source and attaches
# winwise.html (a copy of index.html) and its SHA-256 checksum.
# It can also be run by hand from the Actions tab for an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the download to, for example v1.1.0
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check that index.html matches src/
        run: node tools/build.mjs --check
      - name: Upload winwise.html and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.html winwise.html
          sha256sum winwise.html > winwise.html.sha256
          cat winwise.html.sha256
          gh release upload "$TAG" winwise.html winwise.html.sha256 --clobber --repo "$GITHUB_REPOSITORY"
