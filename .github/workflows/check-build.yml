name: Check build

# Fails when index.html does not match the files in src/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rebuild and compare index.html
        run: node tools/build.mjs --check
